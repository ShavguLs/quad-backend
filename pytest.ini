[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    regression: marks tests as regression tests (run with -m regression)
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, with dependencies)
    e2e: marks tests as end-to-end workflow tests
    slow: marks tests as slow (excluded from quick runs)

# Test discovery
testpaths = apps
